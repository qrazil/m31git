name: Release

# Build 1git (the read-only CLI) and mgit (the interactive client)
# release binaries for each platform and attach them to the GitHub Release
# for a pushed version tag -- the same pattern qrazil/httpserver and
# qrazil/term-markdown's own release.yml use, against a pinned release of
# qrazil/m31 (for the compiler + runtime SDK) and the qrazil/tui commit named
# in `deps`.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# test.yml is a hard precondition, exactly as qrazil/m31's own release.yml
# treats its gates job: a broken build must never produce a release.
env:
  M31_REF: v0.9.0
  # m31 release whose musl tarball builds the Alpine assets (scripts/ci-musl.sh).
  M31_MUSL_REF: v0.9.0

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # softprops/action-gh-release needs this to create the release and upload assets

jobs:
  test:
    name: Test (precondition)
    uses: ./.github/workflows/test.yml

  build-linux-x86_64:
    name: Build — Linux x86-64
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract the m31 release (${{ env.M31_REF }})
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/m31.tar.gz" \
            "https://github.com/qrazil/m31/releases/download/${{ env.M31_REF }}/m31-linux-x86_64.tar.gz"
          mkdir -p "$RUNNER_TEMP/m31"
          tar -C "$RUNNER_TEMP/m31" -xzf "$RUNNER_TEMP/m31.tar.gz"
          chmod +x "$RUNNER_TEMP/m31/m31c"
          echo "LANGC=$RUNNER_TEMP/m31/m31c" >> "$GITHUB_ENV"
          echo "M31_ROOT=$RUNNER_TEMP/m31" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -euo pipefail
          OUT=dist/m31git-linux-x86_64
          mkdir -p "$OUT"
          bash scripts/build.sh git.m31 -o "$OUT/1git"
          bash scripts/build.sh mgit.m31 -o "$OUT/mgit"
          cp README.md docs/design.md docs/FRICTION.md "$OUT/" 2>/dev/null || true
          sed 's/^ *//' > "$OUT/NOTES.txt" <<EOF
          m31git — Linux x86-64 release build
          Built from commit: ${GITHUB_SHA}
          Tag: ${GITHUB_REF_NAME}
          Built against m31 ${{ env.M31_REF }}, tui $(awk '$1=="tui"{print $3}' deps)

          1git                          ./1git -log --max 5
          mgit                          ./mgit (run from a repository's own top level)
          EOF

      - name: Package
        run: tar -C "dist/m31git-linux-x86_64" -czf m31git-linux-x86_64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: m31git-linux-x86_64
          path: m31git-linux-x86_64.tar.gz
          if-no-files-found: error

  build-linux-aarch64:
    name: Build — Linux aarch64
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract the m31 release (${{ env.M31_REF }})
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/m31.tar.gz" \
            "https://github.com/qrazil/m31/releases/download/${{ env.M31_REF }}/m31-linux-aarch64.tar.gz"
          mkdir -p "$RUNNER_TEMP/m31"
          tar -C "$RUNNER_TEMP/m31" -xzf "$RUNNER_TEMP/m31.tar.gz"
          chmod +x "$RUNNER_TEMP/m31/m31c"
          echo "LANGC=$RUNNER_TEMP/m31/m31c" >> "$GITHUB_ENV"
          echo "M31_ROOT=$RUNNER_TEMP/m31" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -euo pipefail
          OUT=dist/m31git-linux-aarch64
          mkdir -p "$OUT"
          bash scripts/build.sh git.m31 -o "$OUT/1git"
          bash scripts/build.sh mgit.m31 -o "$OUT/mgit"
          cp README.md docs/design.md docs/FRICTION.md "$OUT/" 2>/dev/null || true
          sed 's/^ *//' > "$OUT/NOTES.txt" <<EOF
          m31git — Linux aarch64 release build
          Built from commit: ${GITHUB_SHA}
          Tag: ${GITHUB_REF_NAME}
          Built against m31 ${{ env.M31_REF }}, tui $(awk '$1=="tui"{print $3}' deps)

          1git                          ./1git -log --max 5
          mgit                          ./mgit (run from a repository's own top level)
          EOF

      - name: Package
        run: tar -C "dist/m31git-linux-aarch64" -czf m31git-linux-aarch64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: m31git-linux-aarch64
          path: m31git-linux-aarch64.tar.gz
          if-no-files-found: error

  build-macos-arm64:
    name: Build — macOS (arm64)
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract the m31 release (${{ env.M31_REF }})
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/m31.tar.gz" \
            "https://github.com/qrazil/m31/releases/download/${{ env.M31_REF }}/m31-macos-arm64.tar.gz"
          mkdir -p "$RUNNER_TEMP/m31"
          tar -C "$RUNNER_TEMP/m31" -xzf "$RUNNER_TEMP/m31.tar.gz"
          chmod +x "$RUNNER_TEMP/m31/m31c"
          echo "LANGC=$RUNNER_TEMP/m31/m31c" >> "$GITHUB_ENV"
          echo "M31_ROOT=$RUNNER_TEMP/m31" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -euo pipefail
          OUT=dist/m31git-macos-arm64
          mkdir -p "$OUT"
          bash scripts/build.sh git.m31 -o "$OUT/1git"
          bash scripts/build.sh mgit.m31 -o "$OUT/mgit"
          cp README.md docs/design.md docs/FRICTION.md "$OUT/" 2>/dev/null || true
          sed 's/^ *//' > "$OUT/NOTES.txt" <<EOF
          m31git — macOS arm64 (Apple Silicon) release build
          Built from commit: ${GITHUB_SHA}
          Tag: ${GITHUB_REF_NAME}
          Built against m31 ${{ env.M31_REF }}, tui $(awk '$1=="tui"{print $3}' deps)

          1git                          ./1git -log --max 5
          mgit                          ./mgit (run from a repository's own top level)
          EOF

      - name: Package
        run: tar -C "dist/m31git-macos-arm64" -czf m31git-macos-arm64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: m31git-macos-arm64
          path: m31git-macos-arm64.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Alpine / musl: built and smoke-run inside an alpine container with the m31
  # musl release; m31git-linux-<arch>-musl.tar.gz has the same layout as the glibc
  # tarballs. Body: scripts/ci-musl.sh. A plain `docker run` on the host
  # runner, not a job container, because JS actions need glibc node.
  # ---------------------------------------------------------------------
  build-linux-musl:
    name: Build — Linux ${{ matrix.arch }} (musl)
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build and smoke-run in alpine:3.22
        run: |
          docker run --rm -e M31_MUSL_REF -e GITHUB_SHA -e GITHUB_REF_NAME \
            -v "$PWD:/w" -w /w alpine:3.22 sh scripts/ci-musl.sh
          sudo chown -R "$USER" dist *.tar.gz 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: m31git-linux-${{ matrix.arch }}-musl
          path: m31git-linux-${{ matrix.arch }}-musl.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - test
      - build-linux-x86_64
      - build-linux-aarch64
      - build-macos-arm64
      - build-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # SHA256SUMS over the tarballs, in `sha256sum` format with bare file
      # names, so `sha256sum -c` / `shasum -a 256 -c` verify it from the
      # directory the assets were downloaded to (install.sh does).
      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          ls -1 *.tar.gz | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
